nameOverride: ""
fullnameOverride: "networks"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/networks
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1
revisionHistoryLimit: 10
# Recreate, not RollingUpdate: this service binds a durable NATS consumer, and
# NATS allows exactly one binding at a time. A rolling update briefly runs the
# old and new pod together, so the new one dies with "consumer is already bound
# to a subscription" — and because it never becomes ready, the old pod is never
# retired and the rollout deadlocks. Taking the old pod down first costs a few
# seconds of downtime and actually completes.
updateStrategy:
  type: Recreate

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

rbac:
  create: false
  clusterWide: false
  rules: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: true
  type: ClusterIP
  annotations: {}
  labels: {}
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP

containerPorts:
  - name: grpc
    containerPort: 50051
    protocol: TCP

command: []
args: []
env:
  - name: GRPC_ADDRESS
    value: ":50051"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: agyn-platform-database-urls
        key: networks
  - name: DEPENDENCY_CLIENTS_ENABLED
    value: "true"
  - name: AUTHORIZATION_GRPC_TARGET
    value: "authorization:50051"
  - name: ZITI_MANAGEMENT_GRPC_TARGET
    value: "ziti-management:50051"
  - name: IDENTITY_GRPC_TARGET
    value: "identity:50051"
  - name: GROUPS_GRPC_TARGET
    value: "groups:50051"
  # Resolves environment principals on access grants.
  - name: AGENTS_GRPC_TARGET
    value: "agents:50051"
  # Referential-integrity guards, mediation re-derivation, and the
  # hostname-collision fast-fail on access grants.
  - name: EGRESS_RULES_GRPC_TARGET
    value: "egress:50051"
  - name: NOTIFICATIONS_GRPC_TARGET
    value: "notifications:50051"
  - name: NATS_URL
    value: "nats://nats:4222"
  - name: TUNNEL_LIVENESS_INTERVAL
    value: "30s"
  - name: RECONCILIATION_INTERVAL
    value: "60s"
envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts: []
extraVolumes: []

initContainers: []
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: true
  tcpSocket:
    port: grpc
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
